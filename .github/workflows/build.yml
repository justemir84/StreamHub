name: Android Release

# EAS kullanmadan, GitHub runner uzerinde imzali APK uretir ve
# GitHub Releases'e yukler. Uygulama ici guncelleme bu release'i okur.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Compute version
        run: node scripts/ci-version.js

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error title=KEYSTORE_BASE64 eksik::Settings > Secrets and variables > Actions altina KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS ve KEY_PASSWORD ekleyin."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          echo "Keystore hazir."

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error title=Imzalama secret'i eksik::KEYSTORE_PASSWORD, KEY_ALIAS ve KEY_PASSWORD secret'larini ekleyin."
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          if [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          fi
          echo "Build tools: $BUILD_TOOLS"

          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

          cp "$APK" "$APK_NAME"
          ls -lh "$APK_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamHub-${{ env.EXPO_VERSION }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: StreamHub ${{ env.RELEASE_TAG }}
          files: ${{ env.APK_NAME }}
          make_latest: true
          body: |
            StreamHub ${{ env.EXPO_VERSION }} (versionCode ${{ env.VERSION_CODE }})

            Bu APK, uygulama icindeki **Güncellemeyi Kontrol Et** ile de indirilebilir.
